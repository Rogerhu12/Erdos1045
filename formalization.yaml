    authors: ["Boyang Hu"]
    type: paper
    relationship: formalizes
    location: "paper/Erdos1045.pdf; LaTeX source in paper/Erdos1045.tex"
    note: >-
      Manuscript revised September 22, 2026. The accompanying proof snapshot
      and source information are recorded in docs/SOURCE.md. Its main
      conclusions are formalized with the proof adaptations described below,
      including concrete thresholds for the even, odd, perimeter and
      positive KKT conclusions.
  - title: "Erdős problem 1045"
    relationship: background
    location: "https://www.erdosproblems.com/1045"
    contributors:
      - name: "Paul Erdős"
        role: "problem proposer"
