status:
  scope: >-
    Erdos1045.main is the conjunction of five fully specified propositions
    in Challenge.lean. The diameter characterization uses the cutoff
    2^100000000 for odd orders and 2^(10^120) for even orders, including
    attainment, direct-rigid uniqueness, the odd exact formula, and the even
    graph and symmetry data. The perimeter characterization uses 2^100000000.
    The algebraic certificate uses 2^(10^120) and includes uniqueness and
    nonsingularity within its selected polynomial window. The remaining
    propositions are the normalized parity limits and unique positive
    KKT certificate at the same even-order cutoff 2^(10^120). See README.md for their mathematical content.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results: ["Erdos1045.main"]
automation:
  methods:
    - method: agent
      models: ["GPT-6 Astra", "GPT-5.6 Sol", "GPT-5.6 Luna"]
      framework: "OpenAI Codex"
      tool_setup: >-
        Lean proofs were drafted and revised, mathematical dependencies were
        inspected, Lean checks were run, and repository packaging was prepared
        using AI agents.
      prompting_notes: >-
        Human-directed formalization of the manuscript, with
        requests to close assumptions, simplify proofs, and separate statement
        and proof.
  notes: >-
    The initial mathematical draft was generated using GPT-6 Pro. The Lean
    formalization was developed using OpenAI Codex agents, with human
    direction of scope and proof-route choices. The resulting formal proofs
    were checked by Lean 4. The author is responsible for the manuscript
    and for the correspondence between its mathematical statements and
    the formal statements.
fidelity:
  divergences: >-
    Global analytic localization uses an exterior-map/Faber route in place of
    the manuscript's capacity-based localization argument.
    Activity of constraints is proved using feasible lens-coordinate variations
    before KKT. Finite-kernel monotonicity uses exact difference identities and
    function-value convergence. The diameter graph is expressed by the explicit
    cyclic adjacency predicate CanonicalEvenDiameterAdj. The algebraic
    certificate specifies the reference construction, polynomial system and
    window explicitly, and proves existence and uniqueness of the selected root.
    The explicit even-order extension uses quantitative Fourier, localization,
    pressure and Schur estimates to prove the displayed integer cutoff.
    Explicit localization and uniform local rigidity give the smaller common
    threshold for odd diameter and perimeter maximizers. The quantitative
    pressure margin, radial derivative and chart estimates also establish
    unique strictly positive KKT multipliers at the same even-order cutoff.
review:
  status: "self-assessed"
  notes: >-
