version: "v0.4"
project:
  name: "Eventual maximizers of the planar distance product"
  description: >-
    Characterizes planar configurations maximizing the product of squared
    pairwise distances under diameter or convex-hull perimeter constraints.
    The diameter result holds for odd orders at least 2^100000000 and even
    orders at least 2^(10^120), with attainment, direct-rigid uniqueness,
    the exact odd formula and the canonical even graph and symmetries.
    The full perimeter characterization holds above 2^100000000.
    Above the even cutoff the selected stationary polynomial system has a
    unique nonsingular algebraic root in its specified window. The development
    also proves both normalized parity limits and unique positive KKT
    certificates for every even order at least 2^(10^120). This repository
    contains the paper and its Lean 4 formalization.
  authors: ["Boyang Hu"]
  responsible_maintainers: ["Boyang Hu"]
  license: "Apache-2.0"
classification:
  arxiv: ["math.MG", "math.CV"]
  msc2020: ["52A40", "30C85", "05C62"]
sources:
